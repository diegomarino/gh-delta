name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Verify generated skill reference
        run: npm run skill:check

      - name: Verify skill discovery
        if: matrix.node-version == '20.x'
        run: |
          listing="$(npx skills add ./ --list 2>&1)"
          printf '%s\n' "$listing"
          if ! printf '%s\n' "$listing" | grep -Fq -- 'gh-delta'; then
            echo 'skill discovery did not list gh-delta' >&2
            exit 1
          fi

      - name: Report test coverage
        run: npm run test:coverage

      - name: Verify package contents
        run: npm run pack:dry-run

  distribution:
    name: Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Ordinary pull requests run ubuntu only. release-please PRs and
        # pushes to main also run macOS.
        #
        # gh-delta has zero runtime dependencies and no native modules, so
        # there is no per-platform binary surface to guard. This job installs
        # the gh extension and asserts the `gh delta --version` channel string,
        # and the entrypoint (`./gh-delta`) is POSIX `sh`. Ubuntu's /bin/sh is
        # dash while macOS's is bash in POSIX mode, so ubuntu is the *stricter*
        # shell check of the two -- a bashism fails there and passes on macOS,
        # not the reverse. So deferring macOS off the PR critical path costs
        # little, and GitHub's macOS queue can otherwise stall a PR for an
        # hour while every other check is green.
        #
        # But it must stay PRE-MERGE for release commits. `release-please.yml`
        # triggers on the same `push` to main as this workflow and runs
        # CONCURRENTLY with it -- publishing the GitHub Release, which in turn
        # fires `publish.yml` and ships to npm. Nothing makes either wait for
        # this job, so a post-merge macOS run is in a race it can lose: the
        # package can publish before macOS has validated it. Keeping macOS on
        # release-please PRs restores a real gate, because those must be green
        # before the merge that starts the release at all.
        os: >-
          ${{ (github.event_name == 'pull_request'
            && !startsWith(github.head_ref, 'release-please--'))
            && fromJSON('["ubuntu-latest"]')
            || fromJSON('["ubuntu-latest","macos-latest"]') }}

    env:
      GH_CONFIG_DIR: ${{ github.workspace }}/.gh-delta-gh-config

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x

      - name: Install local GitHub CLI extension
        run: |
          mkdir -p "$GH_CONFIG_DIR"
          test -x ./gh-delta
          gh extension install .

      - name: Verify extension version channel
        run: |
          version="$(gh delta --version)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -E '^gh-delta [0-9]+\.[0-9]+\.[0-9]+ \(gh extension\) https://github\.com/diegomarino/gh-delta/releases$'
